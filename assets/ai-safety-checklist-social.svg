<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Plain-Language AI Safety Checklist</title>
  <desc id="desc">Big Iron Construction checklist to keep details private, verify independently, and keep decisions with people.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8efdf"/>
      <stop offset="1" stop-color="#e7d1b3"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b85a25"/>
      <stop offset="1" stop-color="#7c3914"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#241a12" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1115" cy="35" r="245" fill="#384332" opacity=".11"/>
  <circle cx="30" cy="620" r="270" fill="#b85a25" opacity=".11"/>
  <path d="M0 0h24v630H0z" fill="url(#rust)"/>
  <g transform="translate(78 62)">
    <rect width="1044" height="506" rx="30" fill="#fbf5ea" stroke="#241a12" stroke-opacity=".14" filter="url(#shadow)"/>
    <g transform="translate(54 40)">
      <image href="big-iron-logo.png" x="0" y="0" width="86" height="80" preserveAspectRatio="xMidYMid meet"/>
      <text x="108" y="34" fill="#241a12" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="1.6">BIG IRON CONSTRUCTION</text>
      <text x="108" y="67" fill="#6d5947" font-family="Arial, Helvetica, sans-serif" font-size="20">Free homeowner resource · no email</text>
    </g>
    <g transform="translate(54 158)">
      <rect width="286" height="54" rx="27" fill="url(#rust)"/>
      <text x="143" y="37" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">3 SAFETY STEPS</text>
      <text x="0" y="110" fill="#241a12" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">Use AI without handing it</text>
      <text x="0" y="168" fill="#241a12" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">the keys.</text>
      <text x="0" y="220" fill="#6d5947" font-family="Arial, Helvetica, sans-serif" font-size="23">For homeowners, older adults &amp; caregivers.</text>
    </g>
    <g transform="translate(676 362)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
      <g transform="translate(0 0)"><rect width="108" height="62" rx="16" fill="#efe1cd" stroke="#b85a25" stroke-width="3"/><path d="M18 31l10 10 19-22" fill="none" stroke="#384332" stroke-width="6" stroke-linecap="round"/><text x="80" y="36" text-anchor="middle" fill="#7c3914">PRIVATE</text></g>
      <g transform="translate(120 0)"><rect width="108" height="62" rx="16" fill="#efe1cd" stroke="#b85a25" stroke-width="3"/><path d="M16 31l10 10 19-22" fill="none" stroke="#384332" stroke-width="6" stroke-linecap="round"/><text x="80" y="36" text-anchor="middle" fill="#7c3914">VERIFY</text></g>
      <g transform="translate(240 0)"><rect width="128" height="62" rx="16" fill="#efe1cd" stroke="#b85a25" stroke-width="3"/><path d="M18 31l10 10 19-22" fill="none" stroke="#384332" stroke-width="6" stroke-linecap="round"/><text x="82" y="36" text-anchor="middle" fill="#7c3914">DECIDE</text></g>
    </g>
  </g>
</svg>
